<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú Digital — Pantalla Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --font-display: 'Bebas Neue', sans-serif;
      --font-price: 'Montserrat', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      margin: 0;
      background-color: #000;
      color: #1e293b;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .tv-animated-bg {
      background: linear-gradient(-45deg, #FFB703, #FB8500, #FFC300, #F77F00);
      background-size: 300% 300%;
      animation: gradientFlow 12s ease infinite;
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .tv-dots-overlay {
      background-image: radial-gradient(rgba(255, 255, 255, 0.25) 2px, transparent 2px);
      background-size: 28px 28px;
      animation: moveDots 20s linear infinite;
    }
    @keyframes moveDots {
      from { background-position: 0 0; }
      to { background-position: 56px 56px; }
    }
    .steam-particle {
      position: absolute;
      bottom: 10%;
      width: 18px;
      height: 55px;
      background: radial-gradient(circle, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 75%);
      border-radius: 50%;
      filter: blur(6px);
      opacity: 0;
      animation: riseSteam 3.2s ease-in-out infinite;
    }
    .steam-1 { left: 28%; animation-delay: 0s; }
    .steam-2 { left: 48%; animation-delay: 1.1s; height: 68px; width: 22px; }
    .steam-3 { left: 66%; animation-delay: 2.1s; }
    @keyframes riseSteam {
      0% { transform: translateY(10px) scale(0.8); opacity: 0; }
      35% { opacity: 0.65; }
      70% { opacity: 0.35; }
      100% { transform: translateY(-65px) scale(1.5) translateX(10px); opacity: 0; }
    }
    .anim-slide-title { animation: slideInTitle 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-pop-plate { animation: popPlate 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .anim-fade-up-1 { opacity: 0; animation: fadeUp 0.55s ease-out 0.2s forwards; }
    .anim-fade-up-2 { opacity: 0; animation: fadeUp 0.55s ease-out 0.35s forwards; }
    .anim-bounce-price { opacity: 0; animation: bouncePrice 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s forwards; }
    @keyframes slideInTitle {
      from { opacity: 0; transform: translateY(-22px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popPlate {
      from { opacity: 0; transform: scale(0.78) rotate(-6deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bouncePrice {
      0% { opacity: 0; transform: scale(0.4) rotate(-8deg); }
      70% { opacity: 1; transform: scale(1.06) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(-2deg); }
    }
    .clay-plate-wrapper {
      border-radius: 9999px;
      overflow: hidden;
      box-shadow: 0 22px 38px rgba(120, 40, 0, 0.45), inset 0 0 0 4px rgba(154, 72, 25, 0.35);
      background: #8c3f19;
    }
    .clay-plate-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.13);
      border-radius: 9999px;
    }

    .font-display { font-family: var(--font-display); letter-spacing: .03em; }
    .font-price { font-family: var(--font-price); }
    .tv-screen { width: 100%; height: 100dvh; padding: 1.2vh 1.5vw; gap: 1vh; }
    .tv-header { flex: 0 0 auto; }
    .tv-header > div:first-child { background: #80510bc9; border: 0; padding: .45vh 1.2vw; }
    .tv-header span { font-size: clamp(10px, 1.35vw, 24px); }
    #tvSlideContent { min-height: 0; width: 88%; margin: 0 auto; flex: 1; gap: 6%; justify-content: center; }
    .plate-column { width: 40%; position: relative; flex: 0 0 40%; aspect-ratio: 1; }
    .clay-plate-wrapper { width: 100%; height: 100%; }
    .fresh-tag { position: absolute; top: -3%; left: 0; z-index: 25; padding: .35em .9em; background: #ffe18a; border: 2px solid white; border-radius: 99px; color: #20170d; font-size: clamp(10px, 1.2vw, 23px); font-weight: 900; }
    .plate-column > .steam { position: absolute; top: -5%; left: 10%; width: 65%; height: 35%; z-index: 20; pointer-events: none; }
    .price-card { position: absolute; right: -5%; bottom: -7%; z-index: 30; width: 75%; padding: 2% 4%; border: max(3px, .4vw) solid white; border-radius: 1.7vw; background: #cc191e; color: white; text-align: center; box-shadow: 0 1.3vw 2vw #59300066; }
    .price-label { display: inline-block; background: #ffdc32; color: #302007; border-radius: .5em; padding: .1em .65em; font-size: clamp(10px, 1.25vw, 24px); font-weight: 900; text-transform: uppercase; }
    .price-value { font-size: clamp(30px, 5vw, 100px); line-height: 1.05; font-weight: 900; letter-spacing: -.065em; }
    .price-value small { font-size: .38em; color: #ffdc32; letter-spacing: -.03em; }
    .takeout { background: #17131b; color: #ffdc32; border-radius: .65em; padding: .25em; font-size: clamp(10px, 1.35vw, 26px); font-weight: 900; white-space: nowrap; }
    .info-column { width: 54%; display: flex; flex-direction: column; gap: 1.6vh; }
    .dish-heading { position: relative; background: #c41920; color: white; text-align: center; border: .25vw solid #f79955; border-radius: 1.8vw; padding: 1.5vh 1.4vw; box-shadow: 0 .7vw 1vw #9d47032b; }
    .dish-heading h2 { margin: 0; font-size: clamp(26px, 5.2vw, 100px); line-height: 1.05; text-wrap: balance; font-weight: 400; }
    .dish-heading p { margin: .6vh 0 0; color: #fff0bc; font-size: clamp(10px, 1.5vw, 28px); font-weight: 700; line-height: 1.4; }
    .dish-tag { position: absolute; right: 0; bottom: 100%; background: #17131b; color: #ffce16; border-radius: 1vw 1vw 0 0; padding: .25em 1em; font-size: clamp(9px, 1.2vw, 23px); font-weight: 900; text-transform: uppercase; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5vw; }
    .option-card { min-width: 0; background: #fffaf0; border: .25vw solid #ffdc6b; border-radius: 1.8vw; padding: 1vh .8vw; box-shadow: 0 .7vw 1vw #9d47032b; text-align: center; }
    .option-title { display: inline-block; background: #fff0bd; color: #b61920; border-radius: 99px; padding: .25em .8em; font-size: clamp(9px, 1.15vw, 22px); font-weight: 900; text-transform: uppercase; }
    .water-card .option-title { color: #006a94; background: #e0f2fe; }
    .option-list { display: flex; justify-content: space-evenly; gap: .5vw; margin-top: 1vh; }
    .menu-option { flex: 1; min-width: 0; font-size: clamp(9px, 1.2vw, 23px); font-weight: 800; line-height: 1.2; }
    .option-icon { display: flex; align-items: center; justify-content: center; width: 5vw; height: 5vw; margin: 0 auto .7vh; border-radius: 50%; border: .5vw solid white; outline: 1px solid #eedfc0; background: var(--option-color); color: #fff5ce; font-size: 2.5vw; box-shadow: 0 .2vw .4vw #0002; }
    .tv-footer { flex: 0 0 auto; border-radius: 99px; padding: .35vh 1vw; gap: 1vw; flex-wrap: nowrap; }
    .tv-footer > div:first-child { font-size: clamp(9px, 1.1vw, 21px); white-space: nowrap; }
    #tvDessertsBar { flex: 1; justify-content: center; gap: .5vw; font-size: clamp(9px, 1.1vw, 21px); line-height: 1.4; }
    @media (min-aspect-ratio: 2/1) { #tvSlideContent { width: 76%; } .plate-column { width: min(32vw, 62vh); flex-basis: min(32vw, 62vh); } }
    @media (max-aspect-ratio: 1/1) { body { overflow-y: auto; } .tv-screen { height: auto; min-height: 100dvh; } #tvSlideContent { flex-direction: column; gap: 8vh; padding: 5vh 0; } .plate-column { width: 65%; flex-basis: auto; } .info-column { width: 100%; } .dish-heading h2 { font-size: 8vw; } .option-icon { width: 10vw; height: 10vw; font-size: 5vw; } .tv-footer { flex-wrap: wrap; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; } }
  </style>
</head>
<body>

<!-- LIENZO TV 16:9 ABSOLUTO Y LIMPIO -->
<div class="tv-screen w-full h-screen tv-animated-bg relative overflow-hidden flex flex-col justify-between p-[2.2%] select-none">
  <div class="tv-dots-overlay absolute inset-0 pointer-events-none"></div>

  <!-- HEADER -->
  <div class="tv-header relative z-10 flex items-center justify-between">
    <div class="bg-red-700 text-white px-5 py-2 rounded-full shadow-lg flex items-center gap-2 border-2 border-white">
      <i class="fa-solid fa-fire-flame-curved text-amber-300 text-lg"></i>
      <span class="font-extrabold uppercase tracking-wider text-[clamp(0.8rem,1.4vw,1.1rem)]">
          Comida Corrida • Hecha al Momento
        </span>
    </div>
    <div id="slideDots" class="flex items-center gap-1.5 bg-black/25 backdrop-blur-sm px-3.5 py-2 rounded-full"></div>
  </div>

  <!-- CONTENIDO CENTRAL -->
  <div id="tvSlideContent" class="relative z-10 flex-1 my-[1%] flex items-center justify-between gap-[3%]"></div>

  <!-- FOOTER DE POSTRES -->
  <div class="tv-footer relative z-10 bg-slate-950/85 backdrop-blur-md text-white rounded-xl px-5 py-2.5 flex flex-wrap items-center justify-between gap-2 border border-amber-400/30 shadow-lg">
    <div class="flex items-center gap-2 text-amber-400 font-extrabold uppercase text-[clamp(0.75rem,1.2vw,0.95rem)]">
      <i class="fa-solid fa-ice-cream"></i>
      <span>Postres y extras</span>
    </div>
    <div id="tvDessertsBar" class="flex flex-wrap items-center gap-x-6 gap-y-1 text-[clamp(0.75rem,1.2vw,0.95rem)] font-bold"></div>
  </div>
</div>

<script>
  let currentSlideIdx = 0;

  function getFallbackClaySvg(sauceColor = '#4d7c0f') {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><circle cx="150" cy="150" r="146" fill="#9a4819"/><circle cx="150" cy="150" r="132" fill="#7c3510"/><circle cx="150" cy="150" r="126" fill="#b45309"/><path d="M150 32 A118 118 0 0 1 264 150 L150 150 Z" fill="#ea580c"/><path d="M264 150 A118 118 0 0 1 150 264 L150 150 Z" fill="#1c1917"/><path d="M150 264 A118 118 0 0 1 150 32 L150 150 Z" fill="${sauceColor}"/></svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  function renderTvSlide() {
    // Lee los datos guardados en localStorage (sincronizado con admin.html)
    const menuState = JSON.parse(localStorage.getItem('fonda_menu_state_v1'));
    if (!menuState) return;

    const activeDishes = menuState.dishes.filter(d => d.active);
    const activeSoups = menuState.soups.filter(s => s.active);
    const activeWaters = menuState.waters.filter(w => w.active);
    const activeDesserts = menuState.desserts.filter(d => d.active);

    document.getElementById('tvDessertsBar').innerHTML = activeDesserts.length
            ? activeDesserts.map(d => `<span>${d.name} <strong class="text-amber-400">$${d.price}</strong></span>`).join('<span class="text-slate-600">•</span>')
            : '<span class="text-slate-400">Pregunta por nuestros postres del día</span>';

    const stage = document.getElementById('tvSlideContent');
    const dotsContainer = document.getElementById('slideDots');

    if (activeDishes.length === 0) {
      dotsContainer.innerHTML = '';
      stage.innerHTML = `<div class="w-full text-center bg-white/95 backdrop-blur-md rounded-3xl p-8 shadow-2xl border-4 border-red-600"><h2 class="text-3xl font-black text-slate-900">¡Gracias por su preferencia!</h2><p class="text-slate-600 font-semibold mt-1">Esperando platillos activos...</p></div>`;
      return;
    }

    if (currentSlideIdx >= activeDishes.length) currentSlideIdx = 0;

    dotsContainer.innerHTML = activeDishes.map((_, idx) => `
        <span class="h-2 rounded-full transition-all duration-300 ${idx === currentSlideIdx ? 'w-6 bg-red-600' : 'w-2 bg-white/60'}"></span>
      `).join('');

    const dish = activeDishes[currentSlideIdx];

    let dishImage = dish.img;
    if (dish.variants && dish.selectedVariant) {
      const foundVar = dish.variants.find(v => v.label === dish.selectedVariant);
      if (foundVar && foundVar.img) dishImage = foundVar.img;
    }

    const fallbackSvg = getFallbackClaySvg(dish.sauceColor);

    const plateColumn = `
      <div class="plate-column anim-pop-plate">
        <div class="fresh-tag"><i class="fa-solid fa-fire text-red-600"></i> RECIÉN SERVIDO</div>
        <div class="steam"><div class="steam-particle steam-1"></div><div class="steam-particle steam-2"></div><div class="steam-particle steam-3"></div></div>
        <div class="clay-plate-wrapper"><img src="${dishImage}" onerror="this.onerror=null;this.src='${fallbackSvg}';" alt="${dish.name}" class="clay-plate-img" /></div>
        <div class="price-card anim-bounce-price">
          <div class="price-label">Comer aquí</div>
          <div class="price-value font-price">$${dish.price}<small>.00</small></div>
          <div class="takeout font-price"><i class="fa-solid fa-bag-shopping"></i> Para llevar: $${dish.takeoutPrice}.00</div>
        </div>
      </div>`;

    function renderOptions(items, icon, fallback) {
      return items.length ? items.map(item => `
        <div class="menu-option"><span class="option-icon" style="--option-color:${item.color}"><i class="fa-solid ${icon}" aria-hidden="true"></i></span><span>${item.name}</span></div>
      `).join('') : `<div class="menu-option">${fallback}</div>`;
    }

    const infoColumn = `
      <div class="info-column">
        <div class="dish-heading anim-slide-title">
          <div class="dish-tag">${dish.selectedVariant && dish.selectedVariant !== 'Normal' ? dish.selectedVariant : 'Tradicional'}</div>
          <h2 class="font-display">${dish.name}</h2>
          <p><i class="fa-solid fa-circle-check text-amber-300"></i> ${dish.sides}</p>
        </div>
        <div class="options-grid">
          <div class="option-card anim-fade-up-1"><div class="option-title">Entrada a elegir</div><div class="option-list">${renderOptions(activeSoups, 'fa-bowl-rice', 'Sopa del día')}</div></div>
          <div class="option-card water-card anim-fade-up-2"><div class="option-title">Agua del día (1 litro)</div><div class="option-list">${renderOptions(activeWaters, 'fa-glass-water', 'Agua del día')}</div></div>
        </div>
      </div>`;

    stage.innerHTML = plateColumn + infoColumn;
  }

  function nextSlide() {
    const menuState = JSON.parse(localStorage.getItem('fonda_menu_state_v1'));
    if (!menuState) return;
    const activeCount = menuState.dishes.filter(d => d.active).length;
    if (activeCount > 0) {
      currentSlideIdx = (currentSlideIdx + 1) % activeCount;
      renderTvSlide();
    }
  }

  // Rotación automática cada 7 segundos
  setInterval(nextSlide, 7000);

  // Escucha cambios si desde admin.html actualizan algo en otra pestaña
  window.addEventListener('storage', () => { renderTvSlide(); });

  renderTvSlide();
</script>
</body>
</html>

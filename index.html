<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú Digital — Pantalla Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --font-display: 'Bebas Neue', sans-serif;
      --font-price: 'Montserrat', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      margin: 0;
      background-color: #000;
      color: #1e293b;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .tv-animated-bg {
      background: linear-gradient(-45deg, var(--bg-1, #FFB703), var(--bg-2, #FB8500), var(--bg-3, #FFC300), var(--bg-4, #F77F00));
      background-size: 300% 300%;
      animation: gradientFlow 12s ease infinite;
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .tv-dots-overlay {
      background-image: radial-gradient(rgba(255, 255, 255, 0.25) 2px, transparent 2px);
      background-size: 28px 28px;
      animation: moveDots 20s linear infinite;
    }
    @keyframes moveDots {
      from { background-position: 0 0; }
      to { background-position: 56px 56px; }
    }
    .steam-particle {
      position: absolute;
      bottom: 0;
      width: 18%;
      height: 74%;
      background: radial-gradient(ellipse at 50% 65%, rgba(255,255,255,.85) 0%, rgba(255,255,255,.5) 30%, rgba(255,255,255,0) 72%);
      border-radius: 48% 52% 38% 62%;
      filter: blur(6px); filter: blur(clamp(3px, .55vw, 11px));
      opacity: 0;
      transform-origin: center bottom;
      animation: riseSteam 4s ease-in-out infinite;
    }
    .steam-1 { left: 10%; animation-delay: -1s; }
    .steam-2 { left: 32%; height: 95%; width: 22%; animation-delay: -2.7s; }
    .steam-3 { left: 58%; height: 82%; animation-delay: -.2s; }
    .steam-4 { left: 77%; height: 65%; width: 15%; animation-delay: -3.5s; }
    @keyframes riseSteam {
      0% { transform: translate(0, 15%) scale(.65, .7) rotate(-8deg); opacity: 0; }
      20% { opacity: .65; }
      45% { transform: translate(-10%, -28%) scale(1, 1.1) rotate(8deg); opacity: .75; }
      75% { opacity: .5; }
      100% { transform: translate(22%, -95%) scale(1.45, 1.35) rotate(-10deg); opacity: 0; }
    }
    .anim-slide-title { animation: slideInTitle 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-pop-plate { animation: popPlate 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .anim-fade-up-1 { opacity: 0; animation: fadeUp 0.55s ease-out 0.2s forwards; }
    .anim-fade-up-2 { opacity: 0; animation: fadeUp 0.55s ease-out 0.35s forwards; }
    .anim-bounce-price { opacity: 0; animation: bouncePrice 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s forwards; }
    @keyframes slideInTitle {
      from { opacity: 0; transform: translateY(-22px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popPlate {
      from { opacity: 0; transform: scale(0.78) rotate(-6deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bouncePrice {
      0% { opacity: 0; transform: scale(0.4) rotate(-8deg); }
      70% { opacity: 1; transform: scale(1.06) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(-2deg); }
    }
    .clay-plate-wrapper {
      border-radius: 9999px;
      overflow: hidden;
      box-shadow: 0 22px 38px rgba(120, 40, 0, 0.45), inset 0 0 0 4px rgba(154, 72, 25, 0.35);
      background: #8c3f19;
    }
    .clay-plate-wrapper::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0; inset: 0;
      border: .72vw solid #fffdf8; border: clamp(6px, .72vw, 26px) solid #fffdf8;
      box-shadow: inset 0 0 0 1px #ded7cd, inset 0 2px 4px #a1927b25;
      border-radius: inherit;
      z-index: 1;
      pointer-events: none;
    }
    .clay-plate-wrapper.natural-rim::after { display: none; }
    .clay-plate-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.13) rotate(35deg);
      transform-origin: center;
      border-radius: 9999px;
    }

    .font-display { font-family: var(--font-display); letter-spacing: .03em; }
    .font-price { font-family: var(--font-price); }
    .tv-screen { width: 100%; height: 100dvh; padding: 1.2vh 1.5vw; gap: 1vh; }
    .tv-header { flex: 0 0 auto; }
    .tv-header > div:first-child { background: #80510bc9; border: 0; padding: .45vh 1.2vw; }
    .tv-header span { font-size: 1.35vw; font-size: clamp(10px, 1.35vw, 24px); }
    #tvSlideContent { min-height: 0; width: 88%; margin: 0 auto; flex: 1; gap: 6%; justify-content: center; }
    .plate-column { width: min(35.2vw, 61vh); position: relative; flex: 0 0 min(35.2vw, 61vh); aspect-ratio: 1; isolation: isolate; }
    .clay-plate-wrapper { width: 100%; height: 100%; position: relative; z-index: 10; }
    .fresh-tag { position: absolute; top: -3%; left: 0; z-index: 25; padding: .35em .9em; background: #ffe18a; border: 2px solid white; border-radius: 99px; color: #20170d; font-size: 1.2vw; font-size: clamp(10px, 1.2vw, 23px); font-weight: 900; }
    .plate-column > .steam { position: absolute; top: -16%; left: 18%; width: 64%; height: 34%; z-index: 20; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 15%, #000 65%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 15%, #000 65%, transparent); pointer-events: none; }
    .price-card { position: absolute; right: -5%; bottom: -7%; z-index: 30; width: 75%; padding: 2% 4%; border: 4px solid white; border: max(3px, .4vw) solid white; border-radius: 1.7vw; background: #cc191e; color: white; text-align: center; box-shadow: 0 1.3vw 2vw #59300066; }
    .price-label { display: inline-block; background: #ffdc32; color: #302007; border-radius: .5em; padding: .1em .65em; font-size: 1.25vw; font-size: clamp(10px, 1.25vw, 24px); font-weight: 900; text-transform: uppercase; }
    .price-value { font-size: 5vw; font-size: clamp(30px, 5vw, 100px); line-height: 1.05; font-weight: 900; letter-spacing: -.065em; }
    .price-value small { font-size: .38em; color: #ffdc32; letter-spacing: -.03em; }
    .takeout { background: #17131b; color: #ffdc32; border-radius: .65em; padding: .25em; font-size: 1.35vw; font-size: clamp(10px, 1.35vw, 26px); font-weight: 900; white-space: nowrap; }
    .info-column { width: 54%; display: flex; flex-direction: column; gap: 1.6vh; }
    .dish-heading { position: relative; background: #c41920; color: white; text-align: center; border: .25vw solid #f79955; border-radius: 1.8vw; padding: 1.5vh 1.4vw; box-shadow: 0 .7vw 1vw #9d47032b; }
    .dish-heading h2 { margin: 0; font-size: 5.2vw; font-size: clamp(26px, 5.2vw, 100px); line-height: 1.05; text-wrap: balance; font-weight: 400; }
    .dish-heading p { margin: .6vh 0 0; color: #fff0bc; font-size: 1.5vw; font-size: clamp(10px, 1.5vw, 28px); font-weight: 700; line-height: 1.4; }
    .dish-tag { position: absolute; right: 0; bottom: 100%; background: #17131b; color: #ffce16; border-radius: 1vw 1vw 0 0; padding: .25em 1em; font-size: 1.2vw; font-size: clamp(9px, 1.2vw, 23px); font-weight: 900; text-transform: uppercase; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5vw; }
    .option-card { min-width: 0; background: #fffaf0; border: .25vw solid #ffdc6b; border-radius: 1.8vw; padding: 1vh .8vw; box-shadow: 0 .7vw 1vw #9d47032b; text-align: center; }
    .option-title { display: inline-block; background: #fff0bd; color: #b61920; border-radius: 99px; padding: .25em .8em; font-size: 1.15vw; font-size: clamp(9px, 1.15vw, 22px); font-weight: 900; text-transform: uppercase; }
    .water-card .option-title { color: #006a94; background: #e0f2fe; }
    .option-list { display: flex; justify-content: space-evenly; gap: .5vw; margin-top: 1vh; }
    .menu-option { flex: 1; min-width: 0; font-size: 1.2vw; font-size: clamp(9px, 1.2vw, 23px); font-weight: 800; line-height: 1.2; }
    .option-icon { display: flex; align-items: center; justify-content: center; width: 5vw; height: 5vw; margin: 0 auto .7vh; border-radius: 50%; border: .5vw solid white; outline: 1px solid #eedfc0; background: var(--option-color); color: #fff5ce; font-size: 2.5vw; box-shadow: 0 .2vw .4vw #0002; }
    .option-icon { overflow: hidden; }
    .option-icon img { width: 100%; height: 100%; object-fit: contain; background: #fffaf0; }
    .option-icon [hidden] { display: none; }
    .option-card:has(.menu-option:only-child) .option-icon { width: 7vw; height: 7vw; }
    .tv-footer { flex: 0 0 auto; border-radius: 99px; padding: .35vh 1vw; gap: 1vw; flex-wrap: nowrap; }
    .tv-footer > div:first-child { font-size: 1.1vw; font-size: clamp(9px, 1.1vw, 21px); white-space: nowrap; }
    #tvDessertsBar { flex: 1; justify-content: center; gap: .5vw; font-size: 1.1vw; font-size: clamp(9px, 1.1vw, 21px); line-height: 1.4; }
    @media (min-aspect-ratio: 2/1) { #tvSlideContent { width: 76%; } .plate-column { width: min(32vw, 62vh); flex-basis: min(32vw, 62vh); } }
    @media (max-aspect-ratio: 1/1) { body { overflow-y: auto; } .tv-screen { height: auto; min-height: 100dvh; } #tvSlideContent { flex-direction: column; gap: 8vh; padding: 5vh 0; } .plate-column { width: 65%; flex-basis: auto; } .info-column { width: 100%; } .dish-heading h2 { font-size: 8vw; } .option-icon { width: 10vw; height: 10vw; font-size: 5vw; } .tv-footer { flex-wrap: wrap; } }

    .slide-dot { width: .7vw; height: .7vw; min-width: 8px; min-height: 8px; border-radius: 99px; border: 0; background: #ffffff99; cursor: pointer; padding: 0; }
    .slide-dot.selected { width: 2vw; background: #dc2626; }
    .slide-dot:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .tv-screen[data-theme="sunset"] { --bg-1: #ff9e23; --bg-2: #ee481f; --bg-3: #ff7a18; --bg-4: #f6ad35; }
    .tv-screen[data-theme="sweets"] { --bg-1: #fbd0e4; --bg-2: #dfc6ff; --bg-3: #fff0da; --bg-4: #f9b8d1; }
    .tv-screen[data-theme="sweets"] .tv-dots-overlay { background-image: radial-gradient(#fff9 2px, transparent 2px); }
    .tv-screen[data-theme="sweets"] .tv-header > div:first-child { background: #793f7b; }
    .tv-screen[data-kind="desserts"] #tvSlideContent { width: 94%; }
    .dessert-page { width: 100%; position: relative; display: flex; flex-direction: column; gap: 2.2vh; padding: 1vh 1vw; color: #61345f; }
    .dessert-intro { text-align: center; position: relative; z-index: 2; }
    .dessert-eyebrow { margin: 0; font-size: 1.3vw; font-size: clamp(12px, 1.3vw, 28px); font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .dessert-intro h2 { font-size: 5.6vw; font-size: clamp(36px, 5.6vw, 110px); font-weight: 400; line-height: 1; margin: .5vh 0; color: #963a73; text-shadow: 0 3px 0 #fff8; }
    .dessert-intro > p:last-child { margin: 0; font-size: 1.35vw; font-size: clamp(12px, 1.35vw, 28px); font-weight: 600; }
    .dessert-grid { display: grid; grid-template-columns: repeat(var(--dessert-count, 3), minmax(0, 1fr)); gap: 2.2vw; width: 100%; max-width: 1600px; margin: 0 auto; position: relative; z-index: 2; }
    .dessert-card { position: relative; border: max(3px, .3vw) solid #fff; border-radius: 2.6vw; padding: 1.3vh 1.2vw 1.8vh; background: #fff8efed; box-shadow: 0 1vh 0 #a35b8e16, 0 1.6vh 3vh #71345920; text-align: center; display: flex; align-items: center; flex-direction: column; }
    .dessert-card { animation: dessertBounceIn .9s ease-out .12s both; transform-origin: center; }
    .dessert-card:nth-child(2) { animation-delay: .36s; }
    .dessert-card:nth-child(3) { animation-delay: .6s; }
    @keyframes dessertBounceIn {
      0% { opacity: 0; transform: translateY(24px) scale(.65); }
      55% { opacity: 1; transform: translateY(-5px) scale(1.05); }
      75% { opacity: 1; transform: translateY(3px) scale(.975); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .dessert-card:nth-child(2) { background: #fff0f7ed; }
    .dessert-card:nth-child(3) { background: #f6efffed; }
    .dessert-art { width: 100%; height: 25vh; height: clamp(130px, 25vh, 600px); object-fit: contain; filter: drop-shadow(0 1vh .6vh #ab648123); }
    .dessert-card h3 { font-size: 2vw; font-size: clamp(17px, 2vw, 64px); line-height: 1.2; font-weight: 800; min-height: 2.4em; display: flex; align-items: center; justify-content: center; margin: .6vh 0 1vh; text-wrap: balance; }
    .dessert-price { font-size: 3.9vw; font-size: clamp(28px, 3.9vw, 120px); line-height: 1; font-weight: 900; color: #a72e67; margin-top: auto; }
    .dessert-price small { font-size: .4em; }
    .dessert-caption { font-size: 1vw; font-size: clamp(10px, 1vw, 20px); font-weight: 700; margin: .8vh 0 0; color: #8a587e; }
    .sweet-decor { position: absolute; width: 6vw; width: clamp(45px, 6vw, 120px); height: auto; opacity: .65; pointer-events: none; animation: candyFloat 5s ease-in-out infinite; z-index: 0; }
    .sweet-decor-left { left: -1%; top: -2%; transform: rotate(-18deg); }
    .sweet-decor-right { right: 0; top: 3%; animation-delay: -2.5s; }
    .sweet-sparkle { transform-origin: center; animation: sparkle 3s ease-in-out infinite; }
    @keyframes candyFloat { 0%,100% { translate: 0 0; rotate: -12deg; } 50% { translate: 0 -10px; rotate: 12deg; } }
    @keyframes sparkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (min-width: 2000px) { .dessert-grid { max-width: 86vw; } }
    @media (max-aspect-ratio: 1/1) {
      .dessert-page { padding: 0; gap: 2vh; }
      .dessert-grid { grid-template-columns: 1fr; max-width: 500px; gap: 3vh; }
      .dessert-card { border-radius: 24px; padding: 14px; }
      .dessert-art { height: 22vh; }
      .dessert-card h3 { min-height: 0; }
      .dessert-intro h2 { font-size: 11vw; }
      .plate-column { flex-basis: auto; }
    }

    /* Formas de fondo y composición inspirada en el cartel del local. */
    .background-shapes { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .background-blob { position: absolute; width: 65vw; height: 65vw; border-radius: 42% 58% 68% 32% / 51% 32% 68% 49%; background: linear-gradient(135deg, #ffca2470, #ff5c1090); animation: driftShape 19s ease-in-out infinite alternate; }
    .background-blob:nth-child(1) { left: -28%; top: -80%; }
    .background-blob:nth-child(2) { right: -34%; top: -38%; background: linear-gradient(45deg, #e6402270, #ff8a0080); animation-delay: -7s; animation-duration: 24s; }
    .background-blob:nth-child(3) { left: -22%; bottom: -100%; background: linear-gradient(100deg, #ff5e2370, #ffe33e90); animation-delay: -13s; }
    @keyframes driftShape { from { transform: translate(-3%, -2%) rotate(-16deg) scale(.95); border-radius: 42% 58% 68% 32% / 51% 32% 68% 49%; } to { transform: translate(9%, 5%) rotate(22deg) scale(1.12); border-radius: 65% 35% 39% 61% / 35% 58% 42% 65%; } }
    .tv-screen[data-theme="gold"] { --bg-1: #ffab08; --bg-2: #ff8210; --bg-3: #ffbf13; --bg-4: #ff6510; }
    .tv-screen[data-kind="dish"] .tv-dots-overlay { opacity: .12; }
    .tv-screen[data-kind="desserts"] .background-blob { background: linear-gradient(120deg, #ffffff60, #d395e650); }
    .tv-screen[data-kind="dish"] { padding: 2.7vh 2vw 1.8vh; }
    .tv-screen[data-kind="dish"] .tv-header > div:first-child { background: linear-gradient(90deg, #5b200c, #73300b); padding: 1vh 2vw; }
    .tv-screen[data-kind="dish"] #headerIcon { color: #fff5e6; }
    #slideDots { max-width: 38%; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
    .slide-dot { flex-shrink: 0; }
    .slide-dot.selected { background: #ffcf26; }
    .tv-screen[data-kind="dish"] #tvSlideContent { width: 98%; gap: 4%; }
    .tv-screen[data-kind="dish"] .plate-column { width: min(43vw, 67vh); flex: 0 0 min(43vw, 67vh); }
    .tv-screen[data-kind="dish"] .info-column { flex: 1; min-width: 0; width: auto; gap: 4vh; }
    .tv-screen[data-kind="dish"] .dish-heading { background: linear-gradient(125deg, #fff9ef, #fff0e3); border: 2px solid #fff9; border-radius: 3.3vw; padding: 2.5vh 2vw; text-align: left; color: #54200f; box-shadow: 0 1.2vh 2.5vh #a3401933; }
    .tv-screen[data-kind="dish"] .dish-heading h2 { font-family: var(--font-body); font-size: 4.3vw; font-size: clamp(28px, 4.3vw, 100px); font-weight: 900; line-height: 1.04; letter-spacing: -.045em; text-wrap: balance; }
    .tv-screen[data-kind="dish"] .dish-heading h2.long-title { font-size: 3.5vw; font-size: clamp(25px, 3.5vw, 84px); }
    .title-word { display: inline-block; animation: wordSettle .8s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--word) * .07s); }
    .title-word.green-word { color: #4d741a; }
    .title-word.red-word { color: #bc3b20; }
    @keyframes wordSettle { from { opacity: 0; transform: translateY(.25em) rotate(-3deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }
    .tv-screen[data-kind="dish"] .dish-heading p { color: #61301c; margin-top: 1.4vh; font-size: 1.35vw; font-size: clamp(12px, 1.35vw, 30px); line-height: 1.35; }
    .tv-screen[data-kind="dish"] .dish-heading p i { color: #5d8528; }
    .tv-screen[data-kind="dish"] .dish-tag { font-size: 1vw; font-size: clamp(10px, 1vw, 22px); right: 3vw; background: #63301a; }
    .tv-screen[data-kind="dish"] .option-card { border: 2px solid #fffc; border-radius: 2.6vw; padding: 0 1vw 1.2vh; background: linear-gradient(135deg, #fffaf2, #fff0e1); }
    .tv-screen[data-kind="dish"] .option-title { position: relative; top: -1.6vh; padding: .35em 1em; color: #54200f; background: linear-gradient(100deg,#ffe259,#ffbb18); box-shadow: 0 .4vh .6vh #a35d1725; border: 2px solid #fff7; font-size: 1.45vw; font-size: clamp(11px,1.45vw,32px); text-transform: none; line-height: 1.15; }
    .tv-screen[data-kind="dish"] .water-card .option-title { color: #233963; background: linear-gradient(100deg,#d1f2ff,#8bd7f4); }
    .tv-screen[data-kind="dish"] .option-list { margin-top: -1vh; gap: .45vw; }
    .tv-screen[data-kind="dish"] .menu-option { background: #efcfb22b; border-radius: 1.6vw; padding: .4vh .15vw; color: #54200f; font-size: 1.5vw; font-size: clamp(11px,1.5vw,32px); }
    .tv-screen[data-kind="dish"] .option-icon { width: 100%; height: 12vh; height: clamp(66px, 12vh, 260px); border: 0; outline: 0; border-radius: 0; background: transparent; box-shadow: none; overflow: visible; }
    .tv-screen[data-kind="dish"] .option-icon img { background: transparent; filter: drop-shadow(0 .5vh .5vh #893d2320); }
    .tv-screen[data-kind="dish"] .option-icon > i { background: var(--option-color); border-radius: 50%; padding: .6em; font-size: 2vw; }
    .tv-screen[data-kind="dish"] .price-card { background: linear-gradient(125deg, #f32632, #ce0d1b); border-radius: 2.8vw; width: 84%; right: -2%; padding: 4% 4% 3%; }
    .price-card::after { z-index: 0; content: ''; position: absolute; top: .6vw; right: .6vw; bottom: .6vw; left: .6vw; inset: .6vw; border: 1px dashed #ffffff80; border-radius: 2.1vw; pointer-events: none; }
    .tv-screen[data-kind="dish"] .price-label { position: relative; z-index: 1; margin-top: -10%; display: table; margin-left: auto; margin-right: auto; padding: .3em 1em; border-radius: .7em; background: linear-gradient(100deg,#ffe96e,#ffcd27); font-size: 1.65vw; font-size: clamp(12px,1.65vw,38px); text-transform: none; }
    .tv-screen[data-kind="dish"] .price-value { font-size: 6.4vw; font-size: clamp(40px, 6.4vw, 150px); }
    .tv-screen[data-kind="dish"] .takeout { background: #9b1017; font-size: 1.5vw; font-size: clamp(12px,1.5vw,34px); padding: .3em; }
    .price-value > span { display: inline-block; animation: priceNudge 4.5s ease-in-out 1s infinite; }
    @keyframes priceNudge { 0%,80%,100% { transform: scale(1); } 88% { transform: scale(1.035) rotate(-1deg); } 94% { transform: scale(1.01); } }
    .accent-rays { position: absolute; width: 13%; height: auto; left: -2%; top: 3%; z-index: 24; pointer-events: none; transform-origin: center; animation: raysWiggle 3.5s ease-in-out infinite; }
    .heading-rays { left: auto; right: 2%; top: -7%; width: 10%; color: #55791e; }
    @keyframes raysWiggle { 0%,100% { transform: rotate(-7deg) scale(.95); opacity: .7; } 50% { transform: rotate(7deg) scale(1.08); opacity: 1; } }
    .tv-screen[data-kind="dish"] .fresh-tag { left: 5%; top: -4%; font-size: 1vw; font-size: clamp(10px,1vw,22px); }
    .tv-screen[data-kind="dish"] .tv-footer { background: linear-gradient(100deg,#57200e,#7a2b0c); padding: 1vh 1.5vw; border-radius: 1.6vw; }
    @media (min-aspect-ratio: 2/1) { .tv-screen[data-kind="dish"] .plate-column { width: 64vh; flex-basis: 64vh; } .tv-screen[data-kind="dish"] #tvSlideContent { width: 88%; } }
    @media (max-aspect-ratio: 1/1) {
      .tv-screen[data-kind="dish"] #tvSlideContent { width: 94%; gap: 10vh; }
      .tv-screen[data-kind="dish"] .plate-column { width: 72vw; flex-basis: auto; }
      .tv-screen[data-kind="dish"] .info-column { width: 100%; gap: 4vh; }
      .tv-screen[data-kind="dish"] .dish-heading { border-radius: 24px; padding: 20px; }
      .tv-screen[data-kind="dish"] .dish-heading h2, .tv-screen[data-kind="dish"] .dish-heading h2.long-title { font-size: 8vw; }
      .tv-screen[data-kind="dish"] .option-card { border-radius: 20px; }
      .tv-screen[data-kind="dish"] .price-value { font-size: 11vw; }
      .tv-screen[data-kind="dish"] .takeout { font-size: 3vw; }
      .tv-screen[data-kind="dish"] .price-label { font-size: 3.5vw; }
      #slideDots { max-width: 27%; }
    }

    /* TV: estilos esenciales locales, incluso si una fuente o CDN no responde. */
    .menu-empty { width: 100%; padding: 32px; background: #fffaf0; color: #54200f; border-radius: 24px; text-align: center; }
    html, body { width: 100%; min-height: 100%; }
    body { font-family: Poppins, Arial, sans-serif; }
    h2, h3, p { margin: 0; }
    button { font: inherit; }
    img { display: block; }
    .tv-screen { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; height: 100dvh; }
    .tv-dots-overlay { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
    .tv-header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; min-height: 5vh; }
    .tv-header > div:first-child { display: flex; align-items: center; border-radius: 50px; color: white; font-weight: 900; text-transform: uppercase; }
    #headerIcon { margin-right: .7vw; }
    #slideDots { display: flex; align-items: center; padding: .8vh 1vw; background: rgba(80,30,10,.6); border-radius: 50px; }
    .slide-dot { margin: 0 .22vw; }
    #tvSlideContent { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; min-height: 0; margin-top: 3vh; margin-bottom: 3vh; }
    .tv-screen[data-kind="dish"] .plate-column { flex: 0 0 40vw; width: 40vw; height: 40vw; max-width: 65vh; max-height: 65vh; margin-right: 4vw; }
    .tv-screen[data-kind="dish"] .info-column { display: flex; flex-direction: column; flex: 1 1 0%; min-width: 0; }
    .dish-heading { margin-bottom: 3vh; }
    .options-grid { display: flex; grid-template-columns: none; }
    .option-card { flex: 1 1 0%; min-width: 0; }
    .option-card + .option-card { margin-left: 1.2vw; }
    .option-list { display: flex; }
    .menu-option + .menu-option { margin-left: .4vw; }
    .price-card { position: absolute; text-align: center; }
    .price-value { margin: .5vh 0; }
    .fresh-tag { white-space: nowrap; }
    .tv-footer { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; color: white; }
    .tv-footer > div:first-child { display: flex; align-items: center; font-weight: 800; }
    .tv-footer i { margin-right: .5vw; }
    #tvDessertsBar { display: flex; flex-wrap: wrap; align-items: center; font-weight: 700; }
    #tvDessertsBar strong { color: #ffdc32; }
    #screenSyncStatus { position: relative; z-index: 10; text-align: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    #screenSyncStatus:empty { display: none; }
    .dessert-grid { display: flex; }
    .dessert-card { flex: 1 1 0%; min-width: 0; }
    .dessert-card + .dessert-card { margin-left: 2vw; }
    /* Gap is additive on new browsers; margins alone work on old TVs. */
    .tv-screen, #tvSlideContent, .info-column, .options-grid, .option-list, .dessert-grid { gap: 0; }
    @media (orientation: landscape) and (max-height: 650px) {
      .tv-screen[data-kind="dish"] .dish-heading { padding: 1.7vh 1.5vw; border-radius: 24px; }
      .tv-screen[data-kind="dish"] .dish-heading h2 { font-size: 4vw; }
      .tv-screen[data-kind="dish"] .dish-heading h2.long-title { font-size: 3vw; }
      .tv-screen[data-kind="dish"] .dish-heading p { font-size: 1.25vw; margin-top: 1vh; }
      .tv-screen[data-kind="dish"] .option-title { font-size: 1.3vw; }
      .tv-screen[data-kind="dish"] .menu-option { font-size: 1.35vw; }
      .tv-screen[data-kind="dish"] .option-icon { height: 10vh; }
      .tv-screen[data-kind="dish"] .plate-column { width: 62vh; height: 62vh; flex-basis: 62vh; }
      .tv-screen[data-kind="dish"] .price-value { font-size: 8vh; }
      .tv-screen[data-kind="dish"] .price-label { font-size: 2.5vh; }
      .tv-screen[data-kind="dish"] .takeout { font-size: 2.5vh; }
      .dessert-art { height: 23vh; }
      .dessert-intro h2 { font-size: 7vh; }
      .dessert-card h3 { font-size: 3vh; }
      .dessert-price { font-size: 6vh; }
    }
    @media (max-aspect-ratio: 1/1) {
      body { overflow-y: auto; height: auto; }
      .tv-screen, .tv-screen[data-kind="dish"] { height: auto; min-height: 100vh; padding: 16px; }
      .tv-header { margin-bottom: 24px; }
      .tv-header span { font-size: 11px; }
      #tvSlideContent { flex-direction: column; }
      .tv-screen[data-kind="dish"] .plate-column { flex: 0 0 auto; width: 68vw; height: 68vw; max-width: none; max-height: none; margin: 8vh 0 12vh; }
      .tv-screen[data-kind="dish"] .info-column { flex: 0 0 auto; width: 100%; }
      .dish-heading { margin-bottom: 4vh; }
      .dessert-grid { flex-direction: column; }
      .dessert-card + .dessert-card { margin-left: 0; margin-top: 20px; }
      .tv-footer { flex-wrap: wrap; margin-top: 20px; }
      .dessert-intro { margin-bottom: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; } }
  </style>
</head>
<body>

<!-- LIENZO TV 16:9 ABSOLUTO Y LIMPIO -->
<div id="tvScreen" data-theme="gold" data-kind="dish" class="tv-screen w-full h-screen tv-animated-bg relative overflow-hidden flex flex-col justify-between p-[2.2%] select-none">
  <div class="background-shapes" aria-hidden="true"><div class="background-blob"></div><div class="background-blob"></div><div class="background-blob"></div></div>
  <div class="tv-dots-overlay absolute inset-0 pointer-events-none"></div>

  <!-- HEADER -->
  <div class="tv-header relative z-10 flex items-center justify-between">
    <div class="bg-red-700 text-white px-5 py-2 rounded-full shadow-lg flex items-center gap-2 border-2 border-white">
      <i id="headerIcon" class="fa-solid fa-fire-flame-curved text-amber-300 text-lg"></i>
      <span id="headerLabel" class="font-extrabold uppercase tracking-wider text-[clamp(0.8rem,1.4vw,1.1rem)]">
          Comida Corrida • Hecha al Momento
        </span>
    </div>
    <div id="slideDots" class="flex items-center gap-1.5 bg-black/25 backdrop-blur-sm px-3.5 py-2 rounded-full"></div>
  </div>

  <!-- CONTENIDO CENTRAL -->
  <div id="tvSlideContent" class="relative z-10 flex-1 my-[1%] flex items-center justify-between gap-[3%]"></div>

  <p id="screenSyncStatus" role="status" class="relative z-10 text-xs font-bold text-center"></p>
  <!-- EXTRAS SALADOS: los postres tienen su propia diapositiva -->
  <div id="extrasFooter" class="tv-footer relative z-10 bg-slate-950/85 backdrop-blur-md text-white rounded-xl px-5 py-2.5 flex flex-wrap items-center justify-between gap-2 border border-amber-400/30 shadow-lg">
    <div class="flex items-center gap-2 text-amber-400 font-extrabold uppercase text-[clamp(0.75rem,1.2vw,0.95rem)]">
      <i class="fa-solid fa-utensils"></i>
      <span>Para acompañar</span>
    </div>
    <div id="tvDessertsBar" class="flex flex-wrap items-center gap-x-6 gap-y-1 text-[clamp(0.75rem,1.2vw,0.95rem)] font-bold"></div>
  </div>
</div>

<script src="menu-state.js?v=f7318be35728"></script>
<script src="firebase-sync.js?v=a9241fdd685a"></script>
<script>
  let currentSlideIdx = 0;

  function getFallbackClaySvg(sauceColor = '#4d7c0f') {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><circle cx="150" cy="150" r="146" fill="#9a4819"/><circle cx="150" cy="150" r="132" fill="#7c3510"/><circle cx="150" cy="150" r="126" fill="#b45309"/><path d="M150 32 A118 118 0 0 1 264 150 L150 150 Z" fill="#ea580c"/><path d="M264 150 A118 118 0 0 1 150 264 L150 150 Z" fill="#1c1917"/><path d="M150 264 A118 118 0 0 1 150 32 L150 150 Z" fill="${sauceColor}"/></svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg).replace(/'/g, '%27');
  }

  function dessertIllustration(id) {
    const plate = '<ellipse cx="160" cy="205" rx="128" ry="28" fill="#e8c6d6"/><ellipse cx="160" cy="198" rx="128" ry="28" fill="#fff"/><ellipse cx="160" cy="198" rx="101" ry="18" fill="#fff1de"/>';
    const art = {
      platanos: `<g stroke="#ad5a21" stroke-width="3" stroke-linejoin="round">
        <path d="M56 168Q120 91 255 140Q193 154 92 199Q61 201 56 168" fill="#efb550"/>
        <path d="M65 150Q148 90 251 119Q181 130 103 179Q72 181 65 150" fill="#d99435"/>
        <path d="M76 125Q157 83 240 100Q191 105 113 151Q81 157 76 125" fill="#f4be5a"/>
      </g><g stroke="#fff4d5" stroke-width="9" stroke-linecap="round"><path d="M95 128l24 43m10-56l22 44m12-54l20 41m13-39l17 28"/></g><g fill="#a64f26"><ellipse cx="82" cy="160" rx="6" ry="3"/><ellipse cx="232" cy="120" rx="7" ry="3"/><ellipse cx="154" cy="179" rx="5" ry="3"/></g>`,
      gelatina: `<path d="M79 178L97 100Q160 77 223 100L241 178Q232 210 160 210Q88 210 79 178" fill="#ed4f80" stroke="#c83668" stroke-width="3"/><ellipse cx="160" cy="101" rx="63" ry="20" fill="#ff92b2"/><ellipse cx="160" cy="100" rx="40" ry="10" fill="#ffb4cd"/><path d="M105 121l-9 54m34-46l-5 58m35-54v61m30-65l5 58m20-66l9 54" fill="none" stroke="#ffacc7" stroke-width="7" stroke-linecap="round"/><path d="M98 181Q158 209 223 183" stroke="#c83668" stroke-width="4" fill="none"/>`,
      flan: `<ellipse cx="160" cy="197" rx="91" ry="19" fill="#aa572c"/><path d="M91 177l15-65Q160 95 214 112l15 65Q216 198 160 198Q104 198 91 177" fill="#ffda87" stroke="#c18c45" stroke-width="3"/><path d="M112 126l-7 45m27-39l-3 50m31-47v50m28-53l4 48m18-54l7 42" stroke="#ffe9b5" stroke-width="7" stroke-linecap="round"/><ellipse cx="160" cy="114" rx="55" ry="17" fill="#a34b27"/><ellipse cx="156" cy="110" rx="39" ry="9" fill="#d1823a"/><path d="M123 115q-6 27 4 25q8-3 4-23m51-1q-4 35 6 29q8-4 1-30" fill="#a34b27"/><circle cx="160" cy="87" r="12" fill="#e64961"/><path d="M160 76q0-16 13-20" stroke="#54894e" stroke-width="4" fill="none"/>`
    };
    return `<svg class="dessert-art" viewBox="0 0 320 240" role="img" aria-label="Ilustración de ${id === 'platanos' ? 'plátanos fritos con lechera' : id === 'flan' ? 'flan de leche' : 'gelatina'}">${plate}${art[id]}<g class="sweet-sparkle" fill="#d79cce"><path d="M54 65l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/><path d="M267 55l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/></g></svg>`;
  }

  function renderDesserts(desserts) {
    const candy = `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M30 40L7 23v50l23-15m40-18l23-17v50L70 58" fill="#ed86ae"/><rect x="25" y="25" width="50" height="50" rx="18" fill="#fff1c9" stroke="#fff" stroke-width="3"/><path d="M39 28l22 44M28 39l13 28m18-37l13 26" stroke="#c19ae8" stroke-width="9"/></svg>`;
    return `<section class="dessert-page" aria-label="Postres disponibles">
      <div class="sweet-decor sweet-decor-left">${candy}</div><div class="sweet-decor sweet-decor-right">${candy}</div>
      <header class="dessert-intro anim-slide-title"><p class="dessert-eyebrow">Siempre hay lugar para algo dulce</p><h2 class="font-display">¡El final más dulce!</h2><p>Elige tu postre favorito</p></header>
      <div class="dessert-grid" style="--dessert-count:${desserts.length}">${desserts.map(item => {
        const price = Number(item.price).toFixed(2).split('.');
        return `<article class="dessert-card">${item.img ? `<img class="dessert-art" src="${item.img}" alt="${item.name}" onerror="this.hidden=true;this.nextElementSibling.hidden=false;"><div hidden>${dessertIllustration(item.id)}</div>` : dessertIllustration(item.id)}<h3>${item.name}</h3><div class="dessert-price font-price">$${price[0]}<small>.${price[1]}</small></div><p class="dessert-caption">Un antojito para sonreír</p></article>`;
      }).join('')}</div>
    </section>`;
  }

  function titleWords(name) {
    return name.split(' ').map((word, index) => `<span class="title-word ${/^verdes?$/i.test(word) ? 'green-word' : /^(rojo|roja|rojos|rojas|morita|adobo)$/i.test(word) ? 'red-word' : ''}" style="--word:${index}">${word}</span>`).join(' ');
  }
  function accentRays(extraClass = '') {
    return `<svg class="accent-rays ${extraClass}" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"><path transform="${extraClass === 'heading-rays' ? 'translate(100 0) scale(-1 1)' : ''}" d="M21 17l19 25M54 9l5 27M9 53l25 9"/></svg>`;
  }

  function renderTvSlide() {
    // Lee los datos guardados en localStorage (sincronizado con admin.html)
    const menuState = FondaMenu.load();
    if (!menuState) return;

    const activeDishes = menuState.dishes.filter(d => d.active);
    const activeSoups = menuState.soups.filter(s => s.active);
    const activeWaters = menuState.waters.filter(w => w.active);
    const activeDesserts = menuState.desserts.filter(d => d.active);

    const desserts = activeDesserts.filter(item => ['platanos', 'gelatina', 'flan'].includes(item.id));
    const extras = activeDesserts.filter(item => !['platanos', 'gelatina', 'flan'].includes(item.id));
    const totalSlides = activeDishes.length + (desserts.length ? 1 : 0);
    const stage = document.getElementById('tvSlideContent');
    const dotsContainer = document.getElementById('slideDots');
    if (currentSlideIdx >= totalSlides) currentSlideIdx = 0;
    const isDessert = desserts.length > 0 && currentSlideIdx === activeDishes.length;
    const screen = document.getElementById('tvScreen');
    screen.dataset.theme = isDessert ? 'sweets' : currentSlideIdx % 2 ? 'sunset' : 'gold';
    screen.dataset.kind = isDessert ? 'desserts' : 'dish';
    document.getElementById('headerLabel').textContent = isDessert ? 'Un dulce final • Hecho con cariño' : 'Comida Corrida • Hecha al Momento';
    document.getElementById('headerIcon').className = `fa-solid ${isDessert ? 'fa-heart' : 'fa-fire-flame-curved'} text-amber-300 text-lg`;
    document.getElementById('extrasFooter').hidden = isDessert || !extras.length;
    document.getElementById('tvDessertsBar').innerHTML = extras.map(d => `<span>${d.name} <strong class="text-amber-400">$${Number(d.price).toFixed(2)}</strong></span>`).join('<span>•</span>');
    dotsContainer.innerHTML = Array.from({length:totalSlides}, (_, idx) => `
      <button type="button" onclick="goToSlide(${idx})" aria-label="${idx === activeDishes.length && desserts.length ? 'Ver postres' : 'Ver guisado ' + (idx + 1)}" aria-pressed="${idx === currentSlideIdx}" class="slide-dot ${idx === currentSlideIdx ? 'selected' : ''}"></button>
    `).join('');
    if (isDessert) {
      stage.innerHTML = renderDesserts(desserts);
      return;
    }
    if (!activeDishes.length) {
      stage.innerHTML = `<div class="menu-empty"><h2 class="text-3xl font-black">¡Gracias por su preferencia!</h2><p>Esperando platillos activos...</p></div>`;
      return;
    }

    const dish = activeDishes[currentSlideIdx];

    let dishImage = dish.img;
    if (dish.variants && dish.selectedVariant) {
      const foundVar = dish.variants.find(v => v.label === dish.selectedVariant);
      if (foundVar && foundVar.img) dishImage = foundVar.img;
    }

    const fallbackSvg = getFallbackClaySvg(dish.sauceColor);

    const plateColumn = `
      <div class="plate-column anim-pop-plate">
        <div style="color:#fff8d6">${accentRays()}</div>
        <div class="fresh-tag"><i class="fa-solid fa-fire text-red-600"></i> RECIÉN SERVIDO</div>
        <div class="steam" aria-hidden="true"><div class="steam-particle steam-1"></div><div class="steam-particle steam-2"></div><div class="steam-particle steam-3"></div><div class="steam-particle steam-4"></div></div>
        <div class="clay-plate-wrapper ${dish.id === 'adobo_puerco' ? 'natural-rim' : ''}"><img src="${dishImage || fallbackSvg}" onerror="this.onerror=null;this.src='${fallbackSvg}';" alt="${dish.name}" class="clay-plate-img" /></div>
        <div class="price-card anim-bounce-price">
          <div class="price-label">${dish.packageItems ? 'Paquete completo' : 'Comer aquí'}</div>
          <div class="price-value font-price"><span>$${Number(dish.price).toFixed(2).split('.')[0]}</span><small>.${Number(dish.price).toFixed(2).split('.')[1]}</small></div>
          ${dish.takeoutPrice != null ? `<div class="takeout font-price"><i class="fa-solid fa-bag-shopping"></i> Para llevar: $${Number(dish.takeoutPrice).toFixed(2)}</div>` : ''}
        </div>
      </div>`;

    function renderOptions(items, icon, fallback) {
      return items.length ? items.map(item => `
        <div class="menu-option"><span class="option-icon" style="--option-color:${item.color}">${item.img ? `<img src="${item.img}" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false;"><i class="fa-solid ${icon}" aria-hidden="true" hidden></i>` : `<i class="fa-solid ${icon}" aria-hidden="true"></i>`}</span><span>${item.name}</span></div>
      `).join('') : `<div class="menu-option">${fallback}</div>`;
    }

    const infoColumn = `
      <div class="info-column">
        <div class="dish-heading anim-slide-title">
          ${accentRays('heading-rays')}
          <div class="dish-tag">${dish.packageItems ? 'Paquete con tacos y agua' : dish.selectedVariant && dish.selectedVariant !== 'Normal' ? dish.selectedVariant : 'Tradicional'}</div>
          <h2 class="font-display ${dish.name.length > 30 ? 'long-title' : ''}">${titleWords(dish.name)}</h2>
          <p><i class="fa-solid fa-circle-check text-amber-300"></i> ${dish.sides}</p>
        </div>
        <div class="options-grid">
          <div class="option-card anim-fade-up-1"><div class="option-title">${dish.packageItems ? 'Incluye en tu paquete' : 'Entrada a elegir'}</div><div class="option-list">${renderOptions(dish.packageItems || activeSoups, dish.packageItems ? 'fa-utensils' : 'fa-bowl-rice', 'Sopa del día')}</div></div>
          <div class="option-card water-card anim-fade-up-2"><div class="option-title">Agua del día (1 litro)</div><div class="option-list">${renderOptions(activeWaters, 'fa-glass-water', 'Agua del día')}</div></div>
        </div>
      </div>`;

    stage.innerHTML = plateColumn + infoColumn;
  }

  function goToSlide(index) { currentSlideIdx = index; renderTvSlide(); }

  function nextSlide() {
    const menuState = FondaMenu.load();
    if (!menuState) return;
    const activeCount = menuState.dishes.filter(d => d.active).length + (menuState.desserts.some(d => d.active && ['platanos', 'gelatina', 'flan'].includes(d.id)) ? 1 : 0);
    if (activeCount > 0) {
      currentSlideIdx = (currentSlideIdx + 1) % activeCount;
      renderTvSlide();
    }
  }

  // Rotación automática cada 7 segundos
  setInterval(nextSlide, 7000);

  // Escucha cambios si desde admin.html actualizan algo en otra pestaña
  window.addEventListener('storage', event => {
    if (event.key === 'fonda_menu_state_v1' || event.key === null) {
      currentSlideIdx = 0;
      renderTvSlide();
    }
  });
  window.addEventListener('focus', renderTvSlide);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) renderTvSlide();
  });

  window.addEventListener('fonda-menu-updated', () => { currentSlideIdx = 0; renderTvSlide(); });
  window.addEventListener('fonda-cloud-status', () => {
    const info = FondaCloud.info;
    document.getElementById('screenSyncStatus').textContent = info.error ? 'Sin conexión al menú compartido' : info.connected ? (info.empty ? 'Esperando publicación del menú' : '') : 'Reconectando…';
  });
  renderTvSlide();
</script>
</body>
</html>

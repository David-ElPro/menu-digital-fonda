<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú Digital — Pantalla Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --font-display: 'Bebas Neue', sans-serif;
      --font-price: 'Montserrat', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      margin: 0;
      background-color: #000;
      color: #1e293b;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .tv-animated-bg {
      background: linear-gradient(-45deg, #FFB703, #FB8500, #FFC300, #F77F00);
      background-size: 300% 300%;
      animation: gradientFlow 12s ease infinite;
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .tv-dots-overlay {
      background-image: radial-gradient(rgba(255, 255, 255, 0.25) 2px, transparent 2px);
      background-size: 28px 28px;
      animation: moveDots 20s linear infinite;
    }
    @keyframes moveDots {
      from { background-position: 0 0; }
      to { background-position: 56px 56px; }
    }
    .steam-particle {
      position: absolute;
      bottom: 10%;
      width: 18px;
      height: 55px;
      background: radial-gradient(circle, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 75%);
      border-radius: 50%;
      filter: blur(6px);
      opacity: 0;
      animation: riseSteam 3.2s ease-in-out infinite;
    }
    .steam-1 { left: 28%; animation-delay: 0s; }
    .steam-2 { left: 48%; animation-delay: 1.1s; height: 68px; width: 22px; }
    .steam-3 { left: 66%; animation-delay: 2.1s; }
    @keyframes riseSteam {
      0% { transform: translateY(10px) scale(0.8); opacity: 0; }
      35% { opacity: 0.65; }
      70% { opacity: 0.35; }
      100% { transform: translateY(-65px) scale(1.5) translateX(10px); opacity: 0; }
    }
    .anim-slide-title { animation: slideInTitle 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-pop-plate { animation: popPlate 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .anim-fade-up-1 { opacity: 0; animation: fadeUp 0.55s ease-out 0.2s forwards; }
    .anim-fade-up-2 { opacity: 0; animation: fadeUp 0.55s ease-out 0.35s forwards; }
    .anim-bounce-price { opacity: 0; animation: bouncePrice 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s forwards; }
    @keyframes slideInTitle {
      from { opacity: 0; transform: translateY(-22px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popPlate {
      from { opacity: 0; transform: scale(0.78) rotate(-6deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bouncePrice {
      0% { opacity: 0; transform: scale(0.4) rotate(-8deg); }
      70% { opacity: 1; transform: scale(1.06) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(-2deg); }
    }
    .clay-plate-wrapper {
      border-radius: 9999px;
      overflow: hidden;
      box-shadow: 0 22px 38px rgba(120, 40, 0, 0.45), inset 0 0 0 4px rgba(154, 72, 25, 0.35);
      background: #8c3f19;
    }
    .clay-plate-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.13);
      border-radius: 9999px;
    }
  </style>
</head>
<body>

<!-- LIENZO TV 16:9 ABSOLUTO Y LIMPIO -->
<div class="w-full h-screen tv-animated-bg relative overflow-hidden flex flex-col justify-between p-[2.2%] select-none">
  <div class="tv-dots-overlay absolute inset-0 pointer-events-none"></div>

  <!-- HEADER -->
  <div class="relative z-10 flex items-center justify-between">
    <div class="bg-red-700 text-white px-5 py-2 rounded-full shadow-lg flex items-center gap-2 border-2 border-white">
      <i class="fa-solid fa-fire-flame-curved text-amber-300 text-lg"></i>
      <span class="font-extrabold uppercase tracking-wider text-[clamp(0.8rem,1.4vw,1.1rem)]">
          Comida Corrida • Hecha al Momento
        </span>
    </div>
    <div id="slideDots" class="flex items-center gap-1.5 bg-black/25 backdrop-blur-sm px-3.5 py-2 rounded-full"></div>
  </div>

  <!-- CONTENIDO CENTRAL -->
  <div id="tvSlideContent" class="relative z-10 flex-1 my-[1%] flex items-center justify-between gap-[3%]"></div>

  <!-- FOOTER DE POSTRES -->
  <div class="relative z-10 bg-slate-950/85 backdrop-blur-md text-white rounded-xl px-5 py-2.5 flex flex-wrap items-center justify-between gap-2 border border-amber-400/30 shadow-lg">
    <div class="flex items-center gap-2 text-amber-400 font-extrabold uppercase text-[clamp(0.75rem,1.2vw,0.95rem)]">
      <i class="fa-solid fa-ice-cream"></i>
      <span>¿Un postre o antojo?</span>
    </div>
    <div id="tvDessertsBar" class="flex flex-wrap items-center gap-x-6 gap-y-1 text-[clamp(0.75rem,1.2vw,0.95rem)] font-bold"></div>
  </div>
</div>

<script>
  let currentSlideIdx = 0;

  function getFallbackClaySvg(sauceColor = '#4d7c0f') {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><circle cx="150" cy="150" r="146" fill="#9a4819"/><circle cx="150" cy="150" r="132" fill="#7c3510"/><circle cx="150" cy="150" r="126" fill="#b45309"/><path d="M150 32 A118 118 0 0 1 264 150 L150 150 Z" fill="#ea580c"/><path d="M264 150 A118 118 0 0 1 150 264 L150 150 Z" fill="#1c1917"/><path d="M150 264 A118 118 0 0 1 150 32 L150 150 Z" fill="${sauceColor}"/></svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  function renderTvSlide() {
    // Lee los datos guardados en localStorage (sincronizado con admin.html)
    const menuState = JSON.parse(localStorage.getItem('fonda_menu_state_v1'));
    if (!menuState) return;

    const activeDishes = menuState.dishes.filter(d => d.active);
    const activeSoups = menuState.soups.filter(s => s.active);
    const activeWaters = menuState.waters.filter(w => w.active);
    const activeDesserts = menuState.desserts.filter(d => d.active);

    document.getElementById('tvDessertsBar').innerHTML = activeDesserts.length
            ? activeDesserts.map(d => `<span>${d.name} <strong class="text-amber-400">$${d.price}</strong></span>`).join('<span class="text-slate-600">•</span>')
            : '<span class="text-slate-400">Pregunta por nuestros postres del día</span>';

    const stage = document.getElementById('tvSlideContent');
    const dotsContainer = document.getElementById('slideDots');

    if (activeDishes.length === 0) {
      dotsContainer.innerHTML = '';
      stage.innerHTML = `<div class="w-full text-center bg-white/95 backdrop-blur-md rounded-3xl p-8 shadow-2xl border-4 border-red-600"><h2 class="text-3xl font-black text-slate-900">¡Gracias por su preferencia!</h2><p class="text-slate-600 font-semibold mt-1">Esperando platillos activos...</p></div>`;
      return;
    }

    if (currentSlideIdx >= activeDishes.length) currentSlideIdx = 0;

    dotsContainer.innerHTML = activeDishes.map((_, idx) => `
        <span class="h-2 rounded-full transition-all duration-300 ${idx === currentSlideIdx ? 'w-6 bg-red-600' : 'w-2 bg-white/60'}"></span>
      `).join('');

    const dish = activeDishes[currentSlideIdx];
    const isFlipped = currentSlideIdx % 2 === 1;

    let dishImage = dish.img;
    let variantTag = '';
    if (dish.variants && dish.variants.length && dish.selectedVariant) {
      const foundVar = dish.variants.find(v => v.label === dish.selectedVariant);
      if (foundVar && foundVar.img) dishImage = foundVar.img;
      if (dish.selectedVariant !== 'Normal') {
        variantTag = `<span class="inline-block bg-amber-300 text-red-950 font-black uppercase px-3 py-0.5 rounded-full text-[clamp(0.7rem,1.2vw,1rem)] ml-2 align-middle shadow">${dish.selectedVariant}</span>`;
      }
    }

    const fallbackSvg = getFallbackClaySvg(dish.sauceColor);

    const plateColumn = `
        <div class="w-[44%] h-full flex items-center justify-center relative anim-pop-plate">
          <div class="absolute -top-6 inset-x-0 h-24 pointer-events-none z-20">
            <div class="steam-particle steam-1"></div>
            <div class="steam-particle steam-2"></div>
            <div class="steam-particle steam-3"></div>
          </div>
          <div class="clay-plate-wrapper w-[min(38vw,450px)] aspect-square relative z-10">
            <img src="${dishImage}" onerror="this.onerror=null;this.src='${fallbackSvg}';" alt="${dish.name}" class="clay-plate-img" />
          </div>
          <div class="anim-bounce-price absolute bottom-[4%] ${isFlipped ? 'left-[4%]' : 'right-[4%]'}; z-30 bg-red-600 text-white rounded-2xl px-5 py-3 shadow-2xl border-4 border-white text-center">
            <div class="text-[clamp(0.6rem,1vw,0.8rem)] font-extrabold uppercase tracking-wider text-amber-200 leading-none">Comer aquí</div>
            <div class="text-[clamp(1.8rem,3.6vw,3rem)] font-black leading-none my-1">$${dish.price}<span class="text-[clamp(0.9rem,1.5vw,1.2rem)]">.00</span></div>
            <div class="bg-slate-950 text-amber-300 text-[clamp(0.65rem,1.1vw,0.88rem)] font-extrabold px-3 py-0.5 rounded-full">
              Para llevar: $${dish.takeoutPrice}.00
            </div>
          </div>
        </div>
      `;

    const infoColumn = `
        <div class="w-[54%] h-full flex flex-col justify-between py-2">
          <div class="anim-slide-title bg-red-700 text-white rounded-2xl p-[3.5%] shadow-xl border-b-4 border-red-900">
            <h2 class="text-[clamp(1.4rem,3.1vw,2.6rem)] font-black uppercase leading-tight tracking-tight">
              ${dish.name} ${variantTag}
            </h2>
            <p class="text-amber-200 font-bold text-[clamp(0.78rem,1.35vw,1.1rem)] mt-1.5 flex items-center gap-2">
              <i class="fa-solid fa-circle-check text-amber-300"></i> ${dish.sides}
            </p>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-2">
            <div class="anim-fade-up-1 bg-white/95 backdrop-blur-md rounded-2xl p-4 shadow-lg border-2 border-amber-300">
              <div class="text-[clamp(0.68rem,1.1vw,0.85rem)] font-black uppercase text-red-700 tracking-wider mb-2 flex items-center gap-2">
                <i class="fa-solid fa-bowl-hot"></i> Entrada a Elegir
              </div>
              <div class="flex flex-wrap gap-2">
                ${activeSoups.length ? activeSoups.map(s => `
                  <span class="bg-amber-100 text-slate-900 border border-amber-300 px-3 py-1.5 rounded-xl font-extrabold text-[clamp(0.75rem,1.2vw,1rem)] flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full" style="background:${s.color}"></span> ${s.name}
                  </span>
                `).join('') : '<span class="text-xs text-slate-500 font-bold">Sopa del día</span>'}
              </div>
            </div>
            <div class="anim-fade-up-2 bg-white/95 backdrop-blur-md rounded-2xl p-4 shadow-lg border-2 border-amber-300">
              <div class="text-[clamp(0.68rem,1.1vw,0.85rem)] font-black uppercase text-sky-700 tracking-wider mb-2 flex items-center gap-2">
                <i class="fa-solid fa-glass-water"></i> Agua Fresca (1 Litro)
              </div>
              <div class="flex flex-wrap gap-2">
                ${activeWaters.length ? activeWaters.map(w => `
                  <span class="bg-sky-100 text-slate-900 border border-sky-300 px-3 py-1.5 rounded-xl font-extrabold text-[clamp(0.75rem,1.2vw,1rem)] flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full" style="background:${w.color}"></span> ${w.name}
                  </span>
                `).join('') : '<span class="text-xs text-slate-500 font-bold">Agua del día</span>'}
              </div>
            </div>
          </div>
        </div>
      `;

    stage.innerHTML = isFlipped ? (plateColumn + infoColumn) : (infoColumn + plateColumn);
  }

  function nextSlide() {
    const menuState = JSON.parse(localStorage.getItem('fonda_menu_state_v1'));
    if (!menuState) return;
    const activeCount = menuState.dishes.filter(d => d.active).length;
    if (activeCount > 0) {
      currentSlideIdx = (currentSlideIdx + 1) % activeCount;
      renderTvSlide();
    }
  }

  // Rotación automática cada 7 segundos
  setInterval(nextSlide, 7000);

  // Escucha cambios si desde admin.html actualizan algo en otra pestaña
  window.addEventListener('storage', () => { renderTvSlide(); });

  renderTvSlide();
</script>
</body>
</html>

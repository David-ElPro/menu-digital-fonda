<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Menú — Celular</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; } </style>
</head>
<body class="min-h-screen pb-16">

<!-- ENCABEZADO MÓVIL -->
<header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-50 shadow-md">
    <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center font-black">
            <i class="fa-solid fa-mobile-screen-button"></i>
        </div>
        <div>
            <h1 class="text-sm font-extrabold tracking-wide leading-tight">PANEL DE CONTROL</h1>
            <p class="text-[11px] text-emerald-400 font-medium">Sincronizado con la Pantalla</p>
        </div>
    </div>
    <a href="index.html" target="_blank" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shadow">
        <i class="fa-solid fa-tv mr-1"></i>Ver TV
    </a>
</header>

<main class="max-w-3xl mx-auto p-4 space-y-5 mt-2">

    <!-- BAJA RÁPIDA -->
    <div class="bg-red-50 border-2 border-red-200 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-2.5">
            <h2 class="text-sm font-black text-red-800 uppercase flex items-center gap-2">
                <i class="fa-solid fa-bolt text-red-600"></i> En Pantalla Ahorita (Toca para quitar si se acaba)
            </h2>
            <span id="activeCountBadge" class="bg-red-600 text-white text-xs font-extrabold px-2.5 py-0.5 rounded-full">0 activos</span>
        </div>
        <div id="quickDeactivateList" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- SOPAS Y AGUAS -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
            <h3 class="font-extrabold text-slate-800 text-sm mb-3 flex items-center gap-2">
                <i class="fa-solid fa-bowl-rice text-orange-500"></i> Sopas del Día (Elige 1 a 3)
            </h3>
            <div id="adminSoupsList" class="space-y-2"></div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
            <h3 class="font-extrabold text-slate-800 text-sm mb-3 flex items-center gap-2">
                <i class="fa-solid fa-glass-water text-sky-500"></i> Aguas del Día (1 o 2)
            </h3>
            <div id="adminWatersList" class="space-y-2"></div>
        </div>
    </div>

    <!-- POSTRES -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h3 class="font-extrabold text-slate-800 text-sm mb-3 flex items-center gap-2">
            <i class="fa-solid fa-cake-candles text-pink-500"></i> Postres y Extras
        </h3>
        <div id="adminDessertsList" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
    </div>

    <!-- GUISADOS -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
            <div>
                <h3 class="font-black text-slate-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-fire-burner text-amber-500"></i> Catálogo de Guisados
                </h3>
                <p class="text-xs text-slate-500">Activa los de hoy y cambia variantes al instante.</p>
            </div>
            <input type="text" id="searchDishInput" oninput="renderAdmin()" placeholder="Buscar guisado..." class="px-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-amber-500 w-full sm:w-56">
        </div>
        <div id="categoryTabs" class="flex gap-1.5 overflow-x-auto pb-2 mb-3"></div>
        <div id="adminDishesList" class="space-y-3"></div>
    </div>

</main>

<script src="menu-state.js"></script>
<script>
    let menuState = FondaMenu.load();
    let selectedCategory = 'Todos';

    function saveState() {
        FondaMenu.save(menuState);
        renderAdmin();
    }

    function getFallbackClaySvg(sauceColor = '#4d7c0f') {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><circle cx="150" cy="150" r="146" fill="#9a4819"/><circle cx="150" cy="150" r="132" fill="#7c3510"/><circle cx="150" cy="150" r="126" fill="#b45309"/><path d="M150 32 A118 118 0 0 1 264 150 L150 150 Z" fill="#ea580c"/><path d="M264 150 A118 118 0 0 1 150 264 L150 150 Z" fill="#1c1917"/><path d="M150 264 A118 118 0 0 1 150 32 L150 150 Z" fill="${sauceColor}"/></svg>`;
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function renderAdmin() {
        const activeDishes = menuState.dishes.filter(d => d.active);
        document.getElementById('activeCountBadge').textContent = `${activeDishes.length} activos`;

        document.getElementById('quickDeactivateList').innerHTML = activeDishes.length
            ? activeDishes.map(d => `
            <button onclick="toggleDish('${d.id}')" class="bg-white hover:bg-red-600 hover:text-white text-slate-800 border border-red-300 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm transition group">
              <span>${d.name}</span>
              <span class="bg-red-100 text-red-700 group-hover:bg-white group-hover:text-red-700 px-1.5 py-0.5 rounded text-[10px] font-black">QUITA</span>
            </button>
          `).join('')
            : '<p class="text-xs text-red-600 font-semibold">No hay platillos activos en este momento.</p>';

        document.getElementById('adminSoupsList').innerHTML = menuState.soups.map(s => `
        <label class="flex items-center justify-between p-2.5 rounded-xl border ${s.active ? 'bg-amber-50 border-amber-400' : 'bg-slate-50 border-slate-200'} cursor-pointer">
          <span class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full" style="background:${s.color}"></span> ${s.name}
          </span>
          <input type="checkbox" ${s.active ? 'checked' : ''} onchange="toggleSoup('${s.id}')" class="w-5 h-5 accent-amber-500 rounded">
        </label>
      `).join('');

        document.getElementById('adminWatersList').innerHTML = menuState.waters.map(w => `
        <label class="flex items-center justify-between p-2.5 rounded-xl border ${w.active ? 'bg-sky-50 border-sky-400' : 'bg-slate-50 border-slate-200'} cursor-pointer">
          <span class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full" style="background:${w.color}"></span> ${w.name}
          </span>
          <input type="checkbox" ${w.active ? 'checked' : ''} onchange="toggleWater('${w.id}')" class="w-5 h-5 accent-sky-500 rounded">
        </label>
      `).join('');

        document.getElementById('adminDessertsList').innerHTML = menuState.desserts.map(des => `
        <label class="flex items-center justify-between p-2.5 rounded-xl border ${des.active ? 'bg-pink-50 border-pink-300' : 'bg-slate-50 border-slate-200'} cursor-pointer">
          <span class="text-xs font-bold text-slate-800">${des.name} <span class="text-pink-600">($${des.price})</span></span>
          <input type="checkbox" ${des.active ? 'checked' : ''} onchange="toggleDessert('${des.id}')" class="w-5 h-5 accent-pink-500 rounded">
        </label>
      `).join('');

        const categories = ['Todos', 'Puerco', 'Res', 'Pollo', 'Antojitos', 'Caldos', 'Especiales'];
        document.getElementById('categoryTabs').innerHTML = categories.map(cat => `
        <button onclick="selectedCategory='${cat}';renderAdmin()" class="px-3 py-1 rounded-full text-xs font-extrabold whitespace-nowrap transition ${selectedCategory === cat ? 'bg-slate-900 text-amber-400' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          ${cat}
        </button>
      `).join('');

        const query = document.getElementById('searchDishInput').value.toLowerCase();
        const filteredDishes = menuState.dishes.filter(d => {
            const matchCat = selectedCategory === 'Todos' || d.category === selectedCategory;
            const matchSearch = d.name.toLowerCase().includes(query);
            return matchCat && matchSearch;
        });

        document.getElementById('adminDishesList').innerHTML = filteredDishes.map(d => `
        <div class="p-3 rounded-2xl border-2 transition ${d.active ? 'bg-emerald-50/70 border-emerald-500 shadow-sm' : 'bg-white border-slate-200'}">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-amber-700 shrink-0 bg-amber-800">
                <img src="${d.img}" onerror="this.onerror=null;this.src='${getFallbackClaySvg(d.sauceColor)}';" class="w-full h-full object-cover scale-110" />
              </div>
              <div>
                <span class="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded bg-slate-200 text-slate-700">${d.category}</span>
                <h4 class="font-extrabold text-slate-900 text-sm mt-0.5">${d.name}</h4>
                <p class="text-xs font-bold text-emerald-700">$${d.price}.00 <span class="text-slate-400 font-normal">| Llevar: $${d.takeoutPrice}.00</span></p>
              </div>
            </div>
            <button onclick="toggleDish('${d.id}')" class="px-4 py-2 rounded-xl font-black text-xs transition shrink-0 ${d.active ? 'bg-emerald-600 text-white shadow' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}">
              ${d.active ? '<i class="fa-solid fa-check mr-1"></i>ACTIVO' : 'ACTIVAR'}
            </button>
          </div>
          ${d.variants && d.variants.length ? `
            <div class="mt-2.5 pt-2.5 border-t border-slate-200/80 flex flex-wrap items-center gap-1.5">
              <span class="text-[11px] font-bold text-slate-500 mr-1">Variante hoy:</span>
              ${d.variants.map(v => `
                <button onclick="setVariant('${d.id}', '${v.label}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${d.selectedVariant === v.label ? 'bg-amber-500 text-slate-950 shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                  ${v.label}
                </button>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function toggleDish(id) {
        const dish = menuState.dishes.find(d => d.id === id);
        if (dish) dish.active = !dish.active;
        saveState();
    }

    function setVariant(id, label) {
        const dish = menuState.dishes.find(d => d.id === id);
        if (dish) dish.selectedVariant = label;
        saveState();
    }

    function toggleSoup(id) {
        const soup = menuState.soups.find(s => s.id === id);
        const activeCount = menuState.soups.filter(s => s.active).length;
        if (!soup.active && activeCount >= 3) { alert('Máximo 3 sopas activas.'); return; }
        soup.active = !soup.active;
        saveState();
    }

    function toggleWater(id) {
        const water = menuState.waters.find(w => w.id === id);
        const activeCount = menuState.waters.filter(w => w.active).length;
        if (!water.active && activeCount >= 2) { alert('Máximo 2 aguas activas.'); return; }
        water.active = !water.active;
        saveState();
    }

    function toggleDessert(id) {
        const des = menuState.desserts.find(d => d.id === id);
        if (des) des.active = !des.active;
        saveState();
    }

    renderAdmin();
</script>
</body>
</html>
